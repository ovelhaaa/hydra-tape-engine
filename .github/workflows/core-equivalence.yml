name: Core Equivalence CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-equivalence-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_TYPE: Release
  MAX_ABS_THRESHOLD: 1e-5
  RMSE_THRESHOLD: 1e-6

jobs:
  build_native_core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure native core
        run: cmake -S . -B build-native -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build native core targets
        run: >-
          cmake --build build-native --config ${CMAKE_BUILD_TYPE} -j
          --target hydra_dsp_core hydra_render_trace_native hydra_golden_regression_native hydra_listen_native hydra_warp_core_test

      - name: Upload native build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-core-build
          path: |
            build-native/hydra_render_trace_native
            build-native/hydra_listen_native
            build-native/hydra_golden_regression_native

  test_native_core:
    runs-on: ubuntu-latest
    needs: build_native_core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure native core
        run: cmake -S . -B build-native -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build native tests
        run: cmake --build build-native --config ${CMAKE_BUILD_TYPE} -j

      - name: Run native test suite
        run: |
          set -o pipefail
          mkdir -p ci-reports/native
          ctest --test-dir build-native --output-on-failure | tee ci-reports/native/ctest_native.txt

      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-core-test-reports
          path: ci-reports/native

  validate_warp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install numpy scipy
      - name: Build native runner
        run: |
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build-native -j --target hydra_listen_native
      - name: Check persistent Python state
        run: python scripts/test_validate_warp_prototype.py
      - name: Render and validate Warp scenarios
        run: >-
          python scripts/validate_warp_prototype.py --listen build-native/hydra_listen_native
          --native-commit "$(git rev-parse HEAD)" --native-build-profile "$CMAKE_BUILD_TYPE"
          --output-dir artifacts/warp-ab
      - name: Upload Warp A/B renders and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accidental-warp-ab
          path: artifacts/warp-ab
      - name: Verify ABI against frozen C 1.2 consumer with AddressSanitizer
        if: ${{ !cancelled() }}
        run: |
          cmake -S . -B build/abi-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
          cmake --build build/abi-asan -j --target hydra_abi_legacy_consumer hydra_warp_core_test
          ctest --test-dir build/abi-asan --output-on-failure -R '^(core_abi_legacy_consumer|core_warp_test)$'

  build_wasm_core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.62

      - name: Cache Emscripten/CMake (wasm)
        uses: actions/cache@v4
        with:
          path: |
            ~/.emscripten_cache
            ~/.cache/emscripten
          key: wasm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'dsp/core/**', 'tests/core/**', 'include/**') }}
          restore-keys: |
            wasm-${{ runner.os }}-

      - name: Configure wasm core
        run: |
          rm -rf build-wasm
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} -DBUILD_WEB=ON -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build wasm core targets
        run: >-
          cmake --build build-wasm --config ${CMAKE_BUILD_TYPE} -j
          --target hydra_render_trace_wasm hydra_golden_regression_wasm hydra_listen_wasm

      - name: Run WASM golden regressions
        run: ctest --test-dir build-wasm --output-on-failure -R '_wasm$'

      - name: Upload wasm build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-core-build
          path: |
            build-wasm/wasm-tests/hydra_render_trace.js
            build-wasm/wasm-tests/hydra_render_trace.wasm
            build-wasm/wasm-tests/hydra_listen.js
            build-wasm/wasm-tests/hydra_listen.wasm
            build-wasm/wasm-tests/hydra_golden_regression.js
            build-wasm/wasm-tests/hydra_golden_regression.wasm

  test_native_vs_wasm:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    needs: [build_native_core, build_wasm_core]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.62

      - name: Configure and build native trace runner
        run: |
          rm -rf build-native
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build-native --config ${CMAKE_BUILD_TYPE} -j --target hydra_render_trace_native

      - name: Configure and build wasm trace runner
        run: |
          rm -rf build-wasm
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} -DBUILD_WEB=ON -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build-wasm --config ${CMAKE_BUILD_TYPE} -j --target hydra_render_trace_wasm

      - name: Capture input and LUT bits before DSP comparison
        run: |
          mkdir -p ci-reports/native-vs-wasm
          python3 tests/core/verify_numerical_inputs.py --native build-native/hydra_render_trace_native --wasm-js build-wasm/wasm-tests/hydra_render_trace.js --output ci-reports/native-vs-wasm/inputs.json
          git rev-parse HEAD > ci-reports/native-vs-wasm/checkout.txt
          g++ --version > ci-reports/native-vs-wasm/compiler.txt
          ldd --version > ci-reports/native-vs-wasm/libc.txt
          emcc --version > ci-reports/native-vs-wasm/emscripten.txt
          sha256sum dsp/core/tape_core.cpp dsp/core/fast_tanh_table.inc tests/core/render_trace.cpp build-native/hydra_render_trace_native build-wasm/wasm-tests/hydra_render_trace.* > ci-reports/native-vs-wasm/sha256.txt
          cp build-native/CMakeCache.txt ci-reports/native-vs-wasm/native-cache.txt
          cp build-wasm/CMakeCache.txt ci-reports/native-vs-wasm/wasm-cache.txt
          cp build-native/compile_commands.json ci-reports/native-vs-wasm/native-commands.json
          cp build-wasm/compile_commands.json ci-reports/native-vs-wasm/wasm-commands.json

      - name: Run native vs wasm equivalence
        run: |
          mkdir -p ci-reports/native-vs-wasm
          python3 tests/core/compare_native_wasm.py \
            --native build-native/hydra_render_trace_native \
            --wasm-js build-wasm/wasm-tests/hydra_render_trace.js \
            --test-name native_vs_wasm_equivalence \
            --max-abs-threshold ${MAX_ABS_THRESHOLD} \
            --rmse-threshold ${RMSE_THRESHOLD} \
            --report-json ci-reports/native-vs-wasm/equivalence_report.json \
            --report-txt ci-reports/native-vs-wasm/equivalence_report.txt \
            --diff-csv ci-reports/native-vs-wasm/diff.csv \
            --render-wav-dir ci-reports/native-vs-wasm/audio

      - name: Verify current stages and preserve contraction control evidence
        if: ${{ !cancelled() && matrix.os == 'ubuntu-26.04' }}
        run: |
          python3 tests/core/diagnose_equivalence.py --current --output ci-reports/native-vs-wasm/stages-gcc15.json
          python3 tests/core/diagnose_equivalence.py --current --extra-flags=-ffp-contract=off --output ci-reports/native-vs-wasm/stages-no-contract.json
          g++ -dM -E -x c++ /dev/null > ci-reports/native-vs-wasm/native-macros.txt
          g++ -Q --help=target > ci-reports/native-vs-wasm/native-target.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('ci-reports/native-vs-wasm/stages-no-contract.json').read_text())
          assert len(report['scenarios']) == 5
          for name, row in report['scenarios'].items():
              assert row['instrumentation_preserves_output_per_backend'], name
              assert row['release']['max_abs'] == row['release']['rmse'] == 0, name
              assert not row['instrumented']['operations'], name
          PY

      - name: Summarize equivalence results
        if: ${{ always() && hashFiles('ci-reports/native-vs-wasm/equivalence_report.json') != '' }}
        run: |
          echo "### Native â†” WASM Equivalence" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('ci-reports/native-vs-wasm/equivalence_report.json').read_text())
          row = f"| {report['test_name']} | {report['max_abs']:.12e} | {report['rmse']:.12e} | {report['status']} |"
          lines = [
              "| Test | max_abs | rmse | Status |",
              "|---|---:|---:|---|",
              row,
          ]
          with open('/tmp/equivalence_summary.md', 'w', encoding='utf-8') as fp:
              fp.write("\n".join(lines) + "\n")
          PY
          cat /tmp/equivalence_summary.md >> "$GITHUB_STEP_SUMMARY"
          cat ci-reports/native-vs-wasm/equivalence_report.txt

      - name: Upload equivalence reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-vs-wasm-equivalence-reports-${{ matrix.os }}
          path: ci-reports/native-vs-wasm


  listening_review:
    runs-on: ubuntu-latest
    needs: [build_native_core, build_wasm_core]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download native runners
        uses: actions/download-artifact@v4
        with:
          name: native-core-build
          path: build-native
      - name: Download WASM runners
        uses: actions/download-artifact@v4
        with:
          name: wasm-core-build
          path: build-wasm/wasm-tests
      - name: Build listening and transition renders
        run: |
          chmod +x build-native/hydra_listen_native
          python3 tests/core/listening_review.py \
            --native build-native/hydra_listen_native \
            --wasm-js build-wasm/wasm-tests/hydra_listen.js \
            --dsp-commit "$GITHUB_SHA" --build-profile "$CMAKE_BUILD_TYPE" \
            --output-dir ci-reports/listening

      - name: Upload listening renders
        uses: actions/upload-artifact@v4
        with:
          name: listening-review
          path: ci-reports/listening

  magnetic_bias_review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the five listening runners
        run: |
          baseline=f8d2851c663d62ae4850087dc5bb255bd8b818be
          original=3bbcd720a2302cdd8b38d5d1e690d8ee521a9efb
          git fetch --no-tags --depth=1 origin "$baseline" "$original"
          git worktree add --detach "$RUNNER_TEMP/bias-baseline" "$baseline"
          git worktree add --detach "$RUNNER_TEMP/bias-original" "$original"
          build_listen() {
            local src=$1 output=$2
            shift 2
            g++ -std=c++17 -DNDEBUG "$@" -I"$src/include" -I"$src/dsp/core" \
              "$src/dsp/core/tape_core.cpp" "$src/dsp/core/hydra_dsp_c_api.cpp" \
              "$src/tests/core/listen.cpp" -o "$RUNNER_TEMP/$output"
          }
          build_listen "$RUNNER_TEMP/bias-baseline" baseline -O3
          build_listen "$RUNNER_TEMP/bias-original" original-strict -O2 -fno-fast-math
          build_listen "$RUNNER_TEMP/bias-original" original-fast -O2 -ffast-math -fno-finite-math-only
          build_listen . corrected-strict -O2 -fno-fast-math
          build_listen . corrected-fast -O2 -ffast-math -fno-finite-math-only
      - name: Render synchronized A/B audio
        run: |
          python -m pip install numpy scipy soundfile
          python scripts/render_magnetic_bias_review.py \
            --baseline "$RUNNER_TEMP/baseline" \
            --original-strict "$RUNNER_TEMP/original-strict" \
            --original-fast "$RUNNER_TEMP/original-fast" \
            --corrected-strict "$RUNNER_TEMP/corrected-strict" \
            --corrected-fast "$RUNNER_TEMP/corrected-fast" \
            --corrected-commit "$(git rev-parse HEAD)" \
            --output-dir ci-reports/magnetic-bias-declick
      - uses: actions/upload-artifact@v4
        with:
          name: magnetic-bias-declick-v1.3
          path: ci-reports/magnetic-bias-declick

  build_esp32_s3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build ESP32-S3 Firmware
        run: pio run -e esp32-s3-devkitc-1
      - name: Validate archived Phase 6.5 physical evidence (not a hardware rerun)
        run: python scripts/validate_phase65_evidence.py docs/evidence/phase65-physical
      - name: Publish verified physical acquisition evidence
        uses: actions/upload-artifact@v4
        with:
          name: hydra-phase65-physical-evidence
          path: docs/evidence/phase65-physical/
          if-no-files-found: error
          retention-days: 90
