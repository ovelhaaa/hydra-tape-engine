name: F4 performance transitions and blind listening
on:
  workflow_dispatch:
  push:
    branches: [experiment/dsp-reform-f4-performance-transitions]
    paths-ignore:
      - 'docs/evidence/dsp-reform-f4/*.md'
      - 'docs/evidence/dsp-reform-f4/*.json'
permissions:
  contents: read
jobs:
  listening:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install numpy==2.4.1 scipy==1.17.0
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.62'
      - name: Build explicit F4=0 and F4=1
        run: |
          for v in 0 1; do
            flags="-DHYDRA_PHASE72_CLASSIC_FEEDBACK_ROUTING=1 -DHYDRA_DSP_REFORM_F2_VARIANT=2 -DHYDRA_DSP_REFORM_F3_VARIANT=0 -DHYDRA_DSP_REFORM_F4_TRANSITIONS=$v"
            cmake -S . -B build/f4-$v-native -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON "-DCMAKE_CXX_FLAGS=$flags"
            cmake --build build/f4-$v-native -j 2
            emcmake cmake -S . -B build/f4-$v-wasm -DBUILD_WEB=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON "-DCMAKE_CXX_FLAGS=$flags"
            cmake --build build/f4-$v-wasm -j 2
          done
      - name: Freeze F3-A and measure transitions
        run: |
          python docs/evidence/dsp-reform-f4/run.py build
          python docs/evidence/dsp-reform-f4/run.py baseline
          python docs/evidence/dsp-reform-f4/run.py measure
          python docs/evidence/dsp-reform-f4/run.py tail
          python docs/evidence/dsp-reform-f4/run.py blocksize
      - name: Native and WASM contracts
        run: |
          for kind in native wasm; do
            ctest --test-dir build/f4-1-$kind --output-on-failure -E "test_golden" \
              --output-junit artifacts/dsp-reform-f4/ctest-$kind.xml || true
            python - "$kind" <<'PY'
import sys, xml.etree.ElementTree as ET
kind = sys.argv[1]
root = ET.parse(f'artifacts/dsp-reform-f4/ctest-{kind}.xml')
failed = [c.attrib['name'] for c in root.iter('testcase') if c.find('failure') is not None]
# The route-A energy assertion is preserved as a known failure, never hidden.
assert failed in ([], ['core_regression']), failed
print(kind, 'ctest failures:', failed)
PY
          done
          python tests/core/compare_native_wasm.py \
            --native build/f4-1-native/hydra_render_trace_native \
            --wasm-js build/f4-1-wasm/wasm-tests/hydra_render_trace.js \
            --report-json artifacts/dsp-reform-f4/native-wasm-parity.json
      - name: Render and verify A/B package
        if: ${{ !cancelled() }}
        run: |
          python docs/evidence/dsp-reform-f4/run.py render
          python docs/evidence/dsp-reform-f4/run.py package
          node --test tools/listening-lab/lab.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydra-dsp-reform-f4-listening
          path: |
            artifacts/dsp-reform-f4/listening/
            artifacts/dsp-reform-f4/*.json
            artifacts/dsp-reform-f4/*.log
            docs/evidence/dsp-reform-f4/
          retention-days: 30
  esp32-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio run -e esp32-s3-f4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydra-f4-esp32-build-not-physical-validation
          path: |
            .pio/build/esp32-s3-f4/firmware.*
            .pio/build/esp32-s3-f4/hydra_firmware_identity.h
