name: Phase 6 Listening Lab

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: listening-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  listening_lab:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install analysis dependencies
        run: python -m pip install -r scripts/listening-lab-requirements.txt
      - name: Build native library and run reference tests
        run: |
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-native --config Release -j 2
          ctest --test-dir build-native --output-on-failure
      - name: Test delivery validation
        run: python -m unittest discover -s scripts -p test_listening_lab.py
      - name: Render all 20 scenarios and analyze
        run: python scripts/render_phase6_review.py --build-dir build-native --output artifacts/listening-lab/phase6-musical-validation
      - name: Verify physical files and hashes
        run: python scripts/package_listening_lab.py artifacts/listening-lab/phase6-musical-validation --validate-only
      - name: Verify repeat-render determinism
        run: |
          python scripts/render_phase6_review.py --build-dir build-native --output artifacts/listening-repeat
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('artifacts/listening-lab/phase6-musical-validation/manifest.json').read_text())
          b = json.loads(Path('artifacts/listening-repeat/manifest.json').read_text())
          assert a == b, 'Equivalent repeated render differs'
          PY
      - name: Install interface test runner
        run: |
          npm ci --prefix tools/phase6-listening-lab
          npx --prefix tools/phase6-listening-lab playwright install --with-deps chromium
      - name: Test interface model and real Chromium Web Audio
        run: |
          npm test --prefix tools/phase6-listening-lab
          npm run test:browser --prefix tools/phase6-listening-lab
      - name: Package verified listening lab
        run: python scripts/package_listening_lab.py artifacts/listening-lab/phase6-musical-validation --archive artifacts/hydra-phase6-listening-lab.zip
      - name: Upload complete package
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: hydra-phase6-listening-lab
          path: artifacts/hydra-phase6-listening-lab.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish review entry point
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          echo "### READY FOR HUMAN LISTENING" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download verified 20-scenario package]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Extract ZIP, serve locally and open /player/. Human audition remains pending. Issue #48 remains open." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload interface test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listening-lab-interface-evidence
          path: artifacts/listening-lab-browser
          if-no-files-found: ignore
