name: Phase 7.2 Feedback Routing A-B-C Experiment

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase72-feedback-${{ github.ref }}
  cancel-in-progress: true

jobs:

  firmware_classic_c:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Compile opt-in ESP32-S3 Classic C firmware
        run: pio run -e esp32-s3-classic-c
      - name: Compile opt-in Classic C stage-profile firmware
        run: pio run -e esp32-s3-classic-c-stageprofile
      - name: Archive test-only firmware; do not flash automatically
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hydra-phase7-2c-esp32-test-binaries
          path: |
            .pio/build/esp32-s3-classic-c/firmware.bin
            .pio/build/esp32-s3-classic-c-stageprofile/firmware.bin
          retention-days: 14

  audition_package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical and audio requirements
        run: python -m pip install -r scripts/listening-lab-requirements.txt
      - name: Verify frozen Phase 7.1 source
        run: git cat-file -e 24977b67e1ab8441080a29d9e5d40114c966ac50^{commit}
      - name: Build both isolated scalar contract and full C-DSP smoke
        run: |
          cmake -S . -B build-native -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native --target hydra_phase72_feedback_routing_test hydra_phase72_classic_core_smoke -j 2
      - name: Test both routing variants
        run: ctest --test-dir build-native -R '^phase72_(feedback_routing_contract|classic_core_smoke)$' --output-on-failure
      - name: Render independent B with approved A and experiment-off A0
        run: |
          python scripts/package_phase72_feedback_ab.py \
            --variant isolated \
            --before-commit 24977b67e1ab8441080a29d9e5d40114c966ac50 \
            --work artifacts/tmp/phase72-feedback-b \
            --output artifacts/listening-lab/phase7-2-feedback \
            --archive artifacts/hydra-phase7-2-feedback-ab.zip
      - name: Render classic-style C with approved A and experiment-off A0
        run: |
          python scripts/package_phase72_feedback_ab.py \
            --variant classic \
            --before-commit 24977b67e1ab8441080a29d9e5d40114c966ac50 \
            --work artifacts/tmp/phase72-feedback-c \
            --output artifacts/listening-lab/phase7-2-classic \
            --archive artifacts/hydra-phase7-2-feedback-ac.zip
      - name: Validate PCM24, telemetry, WAV hashes and both ZIP checksums
        run: |
          python scripts/package_listening_lab.py \
            artifacts/listening-lab/phase7-2-feedback --validate-only
          python scripts/package_listening_lab.py \
            artifacts/listening-lab/phase7-2-classic --validate-only
          (cd artifacts && sha256sum -c hydra-phase7-2-feedback-ab.zip.sha256)
          (cd artifacts && sha256sum -c hydra-phase7-2-feedback-ac.zip.sha256)
      - name: Verify common approved A WAVs are bit-exact across packages
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('artifacts/listening-lab/phase7-2-feedback/manifest.json').read_text())
          c = json.loads(Path('artifacts/listening-lab/phase7-2-classic/manifest.json').read_text())
          assert a['reference_commit'] == c['reference_commit']
          assert a['before_commit'] == c['before_commit']
          assert list(a['scenarios']) == list(c['scenarios'])
          for k in a['scenarios']:
              assert a['scenarios'][k]['original_wav_sha256'] == c['scenarios'][k]['original_wav_sha256'], k
              assert a['scenarios'][k]['stimulus_sha256'] == c['scenarios'][k]['stimulus_sha256'], k
          print('Approved A WAVs and input signals: bit-exact')
          PY
      - name: Upload listening evidence (never a human approval)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hydra-phase7-2-feedback-audio-abc
          path: |
            artifacts/hydra-phase7-2-feedback-ab.zip
            artifacts/hydra-phase7-2-feedback-ab.zip.sha256
            artifacts/hydra-phase7-2-feedback-ac.zip
            artifacts/hydra-phase7-2-feedback-ac.zip.sha256
          retention-days: 30
