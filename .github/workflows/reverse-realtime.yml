name: Phase 6.3 Reverse Real-Time

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reverse-realtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install -r scripts/listening-lab-requirements.txt matplotlib platformio
          mkdir -p ci-reports/reverse

      - name: Build Native suite
        run: |
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-native -j 2

      - name: Run Native regression (must be 15/15)
        run: ctest --test-dir build-native --output-on-failure | tee ci-reports/reverse/native-ctest.txt

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.62

      - name: Build WASM suite
        run: |
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release -DBUILD_WEB=ON -DBUILD_TESTING=ON
          cmake --build build-wasm -j 2

      - name: Run WASM regressions
        id: wasm
        continue-on-error: true
        run: ctest --test-dir build-wasm --output-on-failure | tee ci-reports/reverse/wasm-ctest.txt

      - name: Confirm only issue #48 equivalence failed
        run: |
          python - <<'PY'
          import re, pathlib, sys
          text = pathlib.Path('ci-reports/reverse/wasm-ctest.txt').read_text()
          failed = sorted(set(re.findall(r'\d+ - (\S+) \(Failed\)', text)))
          expected = {'native_vs_wasm_equivalence', 'native_wasm_ab_review_package'}
          if set(failed) - expected:
              print('Unexpected WASM failures:', sorted(set(failed) - expected))
              sys.exit(1)
          print('WASM functional tests pass; issue #48 equivalence remains:', failed)
          PY

      - name: Build ESP32-S3 production and diagnostic firmware
        run: |
          pio run -e esp32-s3-devkitc-1 | tee ci-reports/reverse/esp32-production.txt
          pio run -e esp32-s3-stageprofile | tee ci-reports/reverse/esp32-stageprofile.txt

      - name: Render and validate ten before/after pairs
        run: |
          python scripts/package_reverse_ab.py --archive artifacts/hydra-phase6-reverse-ab.zip | tee ci-reports/reverse/ab-package.txt
          python - <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path('artifacts/listening-lab/phase6-reverse-optimization/reports/comparison.json').read_text())
          rows = report['comparisons']
          if len(rows) != 10:
              sys.exit(f'expected 10 comparisons, got {len(rows)}')
          worst = max(value['max_abs'] for value in rows.values())
          print(f'10 pairs; max_abs={worst}')
          if worst != 0.0:
              sys.exit('before/after is not bit-exact')
          PY

      - name: Upload technical evidence and A/B package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydra-phase6-reverse-ab
          path: |
            ci-reports/reverse/
            artifacts/hydra-phase6-reverse-ab.zip
          retention-days: 30

      - name: Preserve known blocker and require human review
        if: always()
        run: |
          echo "Native 15/15 and A/B package are expected. Issue #48 strict Native/WASM equivalence is unchanged and remains an explicit blocker."
          echo "No merge is authorized; the Phase 6.3 A/B package is NOT REVIEWED."
          if [ "${{ steps.wasm.outcome }}" != "success" ]; then
            echo "::error::Issue #48 equivalence still fails with unchanged thresholds; this is documented, not new."
            exit 1
          fi
