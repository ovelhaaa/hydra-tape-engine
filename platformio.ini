; ARQUIVO: Multi-head-tape-delay-mp3-processor/platformio.ini
; Configuração para YD-ESP32-S3 (N16R8) - Serial CLI Version

[platformio]
default_envs = esp32-s3-devkitc-1

; Common physical configuration, intentionally free of feedback-routing flags.
; The production environment selects C; legacy A explicitly compiles with C=0.
[hydra_s3_common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- VELOCIDADE ---
board_build.f_cpu = 240000000L
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; --- MEMÓRIA (Configuração Específica para N16R8) ---
; N16 = 16MB Flash
; R8 = 8MB PSRAM (Octal/OPI)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

; --- SISTEMA DE ARQUIVOS ---
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

; --- FLAGS DE COMPILAÇÃO ---
extra_scripts = pre:scripts/build_esp32_dsp.py
build_unflags =
    -Os
    -DARDUINO_RUNNING_CORE=1
build_flags =
    -I host/native/esp32
    -I dsp/core
    ; Habilita PSRAM
    -DBOARD_HAS_PSRAM
    ; CONFIGURAÇÃO USB:
    ; Mode 1 = Hardware CDC (USB Serial/JTAG Controller)
    -DARDUINO_USB_MODE=1
    ; CDC On Boot = 1 envia o Serial.print para a porta USB Nativa
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; Keep Arduino setup and the serial CLI responsive when audio overruns on Core 1.
    -DARDUINO_RUNNING_CORE=0
    
    ; Core dump support
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ESP32_ENABLE_COREDUMP_TO_FLASH=y
    -DCONFIG_I2S_SUPPRESS_DEPRECATE_WARN
    
    ; OPTIMIZATIONS
    -O2
    -ffast-math
    -fno-finite-math-only

lib_deps =
    earlephilhower/ESP8266Audio @ ^1.9.7
    adafruit/Adafruit SSD1306 @ ^2.5.10
    adafruit/Adafruit GFX Library @ ^1.11.9

; Production ESP32-S3 build: Classic Tape Feedback C by default.
[env:esp32-s3-devkitc-1]
extends = hydra_s3_common
build_flags =
    ${hydra_s3_common.build_flags}
    -DHYDRA_PHASE72_CLASSIC_FEEDBACK_ROUTING=1

; Explicit, fully independent rollback firmware: no inherited C=1.
[env:esp32-s3-legacy-a]
extends = hydra_s3_common
build_flags =
    ${hydra_s3_common.build_flags}
    -DHYDRA_PHASE72_CLASSIC_FEEDBACK_ROUTING=0

; ============================================
; PHASE 7.4C UNIFIED MOTION EXPERIMENTAL ENVIRONMENT
; Inherits ALL production flags (Classic C, PSRAM, -O2, USB settings, etc).
; ============================================
[env:esp32-s3-phase74c-unified]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DHYDRA_PHASE74C_UNIFIED_MOTION=1

; ============================================
; DIAGNOSTIC FIRMWARE: fine-grained TapeCore stage profile.
; Not used for production builds; adds cycle counters around DSP sub-stages.
; ============================================
[env:esp32-s3-stageprofile]
extends = env:esp32-s3-devkitc-1
build_flags = ${env:esp32-s3-devkitc-1.build_flags} -D HYDRA_DSP_STAGE_PROFILE

; ============================================
; COMPATIBILITY ALIASES / DIAGNOSTICS: CLASSIC C is now production default.
; ============================================
[env:esp32-s3-classic-c]
extends = env:esp32-s3-devkitc-1

; Profiled alias; timing is not comparable to uninstrumented firmware.
[env:esp32-s3-classic-c-stageprofile]
extends = env:esp32-s3-stageprofile

[env:esp32-s3-classic-c-dltrace]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DHYDRA_PHASE72E_DEADLINE_TRACE=1

; ============================================
; NATIVE TEST ENVIRONMENT (Unit Tests on PC)
; ============================================
[env:native]
platform = native
test_framework = unity
test_filter = test_native/*
; Do NOT build src/ folder - tests are standalone
build_src_filter = -<*>
build_flags = 
    -DUNITY_INCLUDE_DOUBLE
    -std=c++14
    -DNATIVE_TEST
    -I test/test_native
lib_compat_mode = off
; Ignore all project libraries - tests are self-contained
lib_ignore = 
    TapeDelay
    MelodyGen
    Frippertronics-Core
    ESP8266Audio
lib_deps =
test_build_src = false

; Studio experiment: build only.
[env:esp32-s3-phase75a1-studio]
extends = env:esp32-s3-phase74c-unified
